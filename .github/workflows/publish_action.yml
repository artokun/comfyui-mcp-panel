name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

# After a successful Registry publish, --ensure --push writes the archival
# `v<X>` tag. contents: write is that push; the job still cannot trigger a
# second publish — GitHub does not run a branches-filtered workflow for a tag
# ref, and GITHUB_TOKEN pushes do not re-fire workflows anyway (#1882).
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # ---- Gate: never publish a broken pack to the Registry. -------------
      # web/js is served live and a broken save crashes the whole ComfyUI
      # frontend; these checks mirror ci.yml and run BEFORE publish. A failed
      # step aborts the job, so the publish step below only runs if all pass.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read authoritative release version
        id: release-version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          semver = re.compile(
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          try:
              with Path("pyproject.toml").open("rb") as pyproject:
                  version = tomllib.load(pyproject)["project"]["version"]
          except (KeyError, TypeError):
              raise SystemExit("pyproject.toml [project].version is required")
          if not isinstance(version, str) or semver.fullmatch(version) is None:
              raise SystemExit("pyproject.toml [project].version must be strict SemVer")
          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              raise SystemExit("GITHUB_OUTPUT is required")
          with Path(output).open("a", encoding="utf-8", newline="") as output_file:
              output_file.write(f"version={version}\n")

      - name: Changelog release guard
        env:
          RELEASE_REF: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: node scripts/check-changelog.mjs "$RELEASE_VERSION" --ref "$RELEASE_REF"

      - name: JS syntax check (web/js)
        shell: bash
        run: |
          set -e
          shopt -s globstar nullglob
          found=0
          for f in web/js/**/*.js; do
            found=1
            echo "node --check $f"
            node --check "$f"
          done
          [ "$found" = "1" ] || { echo "::error::no web/js/*.js files found"; exit 1; }

      # The registry applies .comfyignore with gitignore semantics: a bare
      # `vendor/` matches a vendor dir at ANY depth, so the exclusion meant for
      # the root CI artefact also silently dropped web/js/vendor/ (the runtime
      # marked/DOMPurify/qrcode imports) from the pack — the browser
      # 404'd on import and the sidebar never registered (#749). The parity
      # scan below reimplements the matching root-anchored and cannot see this
      # class of loss, so assert with git's OWN ignore engine instead (empty
      # index: check-ignore skips tracked paths). Mirrors ci.yml.
      - name: Pack contents — runtime assets must not be .comfyignore'd
        shell: bash
        run: |
          set -e
          export GIT_INDEX_FILE="$PWD/.git/pack-contents-empty-index"
          trap 'rm -f "$GIT_INDEX_FILE"' EXIT
          for f in \
            web/js/comfyui-mcp-panel.js \
            web/js/vendor/marked.esm.js \
            web/js/vendor/purify.es.js \
            web/js/vendor/qrcode.esm.js \
          ; do
            # A path that no longer exists passes check-ignore trivially, so a stale
            # entry reads as coverage while asserting nothing at all.
            # web/js/vendor/a2ui-lit.bundle.js sat in this list after #1865 deleted the
            # file, and every publish stayed green over it (#1882). Fail on the stale
            # entry itself, so this list cannot rot back into a no-op.
            if [ ! -e "$f" ]; then
              echo "::error file=.github/workflows/publish_action.yml::$f is listed in the pack-contents gate but does not exist — remove the entry or restore the file; a listed-but-missing path makes this check silently vacuous"
              exit 1
            fi
            if git -c core.excludesFile=.comfyignore check-ignore -q "$f"; then
              echo "::error file=.comfyignore::$f is exclude-matched but imported at runtime — the published pack would 404 on import and the sidebar would never register (#749)"
              exit 1
            fi
          done
          # …while the CI-only vocabulary artefact MUST stay excluded.
          if ! git -c core.excludesFile=.comfyignore check-ignore -q vendor/tool-vocabulary.json; then
            echo "::error file=.comfyignore::vendor/tool-vocabulary.json must stay .comfyignore'd (CI-only artefact consumed by scripts/check-tool-vocabulary.mjs)"
            exit 1
          fi

      # Never publish a version the registry's YARA scan will flag. The rule
      # SUSP_SVG_Onload_Onerror fires on "svg" + ("onload"|"onerror") co-occurring
      # in any file (nocase). Flagged every release 0.1.0→0.6.1. Fix: use
      # addEventListener("load"/"error") and keep onload/onerror tokens out of code+comments.
      # ONE enumeration of the published archive, BOTH YARA parity rules.
      #
      # They were two steps with two different file sets, and that duplication is what
      # produced four rounds of drift: each fix corrected one set and left the other
      # behind. The SVG rule ended up computing tracked-minus-.comfyignore while the
      # exec rule still used hardcoded roots — so `.gitignore`, which IS tracked and is
      # NOT .comfyignore'd, shipped while being scanned by neither. Sharing the
      # enumeration makes that class of divergence impossible rather than unlikely.
      - name: Security scan (Comfy Registry parity — YARA over the published archive)
        shell: bash
        run: |
          python3 - <<'PY'
          import fnmatch, pathlib, re, subprocess, sys

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, text=True, check=True
          ).stdout.split("\0")
          patterns = [
              l.strip()
              for l in pathlib.Path(".comfyignore").read_text(encoding="utf-8").splitlines()
              if l.strip() and not l.strip().startswith("#")
          ]

          def shipped(p: str) -> bool:
              for pat in patterns:
                  if pat.endswith("/") and (p + "/").startswith(pat):
                      return False
                  if fnmatch.fnmatch(p, pat) or fnmatch.fnmatch(pathlib.PurePath(p).name, pat):
                      return False
              return True

          # CHANGELOG.md must stay ignored: it documents security fixes, so it will always
          # quote the very literals the scanner flags.
          if "CHANGELOG.md" not in patterns:
              print("::error file=.comfyignore::CHANGELOG.md must stay .comfyignore'd — its prose quotes exec-call literals the registry YARA scan flags.")
              sys.exit(1)

          EXEC = re.compile(r"subprocess\.(?:Popen|run|call|check_output|check_call)\s*\(|os\.system\s*\(")
          archive = [p for p in tracked if p and shipped(p)]
          bad = []
          for p in archive:
              try:
                  raw = pathlib.Path(p).read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue  # unreadable; nothing to assert
              low = raw.lower()
              if "svg" in low and ("onload" in low or "onerror" in low):
                  bad.append((p, "SUSP_SVG_Onload_Onerror (svg + onload/onerror in one shipped file) — use addEventListener('load'/'error') and drop literal onload/onerror tokens"))
              if EXEC.search(raw):
                  bad.append((p, "process-spawn call literal — the registry YARA scan ($subprocess_popen_direct et al.) flags this in ANY shipped file, prose included"))

          for p, why in bad:
              print(f"::error file={p}::{why}")
          print(f"scanned {len(archive)} shipped files", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

      # 0.6.2 proved the scanner also matches call-shaped literals in shipped
      # markdown PROSE (CHANGELOG.md quoting the removed spawn call → flagged,
      # any-code-execute). CHANGELOG.md must stay .comfyignore'd and no shipped
      # file may contain a process-spawn literal.

      # Absent until now, so a publish could ship what CI would have blocked: this
      # job's header says it mirrors CI, and it can also be invoked manually or race
      # the push-triggered CI run — a red vocabulary check there does not stop this
      # job. A publish path that enforces less than CI makes CI advisory.
      # Pure node + git, so it needs no install.
      - name: Tool vocabulary (no calls to tools that don't exist)
        run: node scripts/check-tool-vocabulary.mjs

      # Python + the real frontend bundle must come BEFORE the tests, exactly as in
      # ci.yml. They used to run after, so browser_tests/unit/frontend-contract.test.mjs —
      # which is written to SKIP when COMFYUI_FRONTEND_STATIC and a local install are both
      # absent — silently skipped its bundle assertions here while being mandatory in CI.
      # A publish path where a test quietly downgrades itself to a no-op is worse than one
      # that omits the test, because the summary still says it ran.
      - name: Install comfyui_frontend_package (for the frontend-contract test)
        shell: bash
        run: |
          python -m pip install --quiet comfyui_frontend_package
          static="$(python -c 'import comfyui_frontend_package, os; print(os.path.join(os.path.dirname(comfyui_frontend_package.__file__), "static"))')"
          echo "COMFYUI_FRONTEND_STATIC=$static" >> "$GITHUB_ENV"
          echo "using installed frontend static bundle at: $static"

      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (Node --test, incl. frontend contract)
        run: npm run test:unit

      - name: Python compile check (__init__.py)
        run: python -m py_compile __init__.py

      # CI parses EVERY Python file and runs Bandit; this job compiled only
      # __init__.py, which does not parse the modules it imports. So a syntax error or
      # an eval() in shipped py/apps_routes.py passed here and was rejected by CI —
      # the publish path being weaker than CI in a third way.
      - name: comfy-cli parity — no exec/eval, no multi-statement lines
        run: |
          python - <<'PY'
          import ast, collections, pathlib, sys
          bad = []
          for f in sorted(pathlib.Path(".").rglob("*.py")):
              if any(p in f.parts for p in (".git", "node_modules", ".venv", "venv", "__pycache__")):
                  continue
              try:
                  tree = ast.parse(f.read_text(encoding="utf-8"), str(f))
              except SyntaxError as e:
                  bad.append(f"{f}:{e.lineno}: syntax error: {e.msg}")
                  continue
              per_line = collections.Counter(
                  n.lineno for n in ast.walk(tree) if isinstance(n, ast.stmt)
              )
              for line in sorted(l for l, c in per_line.items() if c > 1):
                  bad.append(f"{f}:{line}: multiple statements on one line")
              for n in ast.walk(tree):
                  if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id in ("exec", "eval"):
                      bad.append(f"{f}:{n.lineno}: {n.func.id}() call")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Install bandit
        run: pip install bandit

      - name: Security scan (Comfy Registry parity — Bandit)
        run: bandit -r . -s B101,B112,B311

      - name: pyproject.toml is valid + has registry fields + JS version matches
        run: |
          python - <<'PY'
          import tomllib, re, sys, json
          d = tomllib.load(open("pyproject.toml", "rb"))
          proj = d.get("project", {})
          comfy = d.get("tool", {}).get("comfy", {})
          missing = [k for k in ("name", "version", "description", "license") if not proj.get(k)]
          if not comfy.get("PublisherId"):
              missing.append("tool.comfy.PublisherId")
          assert not missing, f"pyproject missing required fields: {missing}"
          # Block a publish whose panel JS PANEL_VERSION (shown in "Need help?"
          # diagnostics) drifted from pyproject — run scripts/set-version.mjs to sync.
          js = open("web/js/comfyui-mcp-panel.js", encoding="utf-8").read()
          m = re.search(r'const PANEL_VERSION = "([^"]+)"', js)
          assert m, "PANEL_VERSION constant not found in web/js/comfyui-mcp-panel.js"
          # The three original witnesses have the reason spelled out in ci.yml: pyproject and
          # PANEL_VERSION are written by the same script, so comparing just those two cannot
          # detect that the script never ran. package.json is the independent witness, and the
          # rendered changelog is the fourth witness because it is what the panel displays.
          pkg = json.load(open("package.json", encoding="utf-8")).get("version")
          try:
              rendered = json.load(open("web/changelog.json", encoding="utf-8"))
          except (OSError, ValueError) as error:
              sys.exit(f"VERSION MISMATCH: web/changelog.json is unreadable — {error}")
          releases = rendered.get("releases") if isinstance(rendered, dict) else None
          rendered_version = (
              releases[0].get("version")
              if isinstance(releases, list)
              and releases
              and isinstance(releases[0], dict)
              and isinstance(releases[0].get("version"), str)
              else None
          )
          # web/changelog.json is the rendered artefact the panel actually ships and displays.
          # Its newest record is a fourth witness: a release can leave all three version files
          # coherent while still shipping notes that stop one version short (#1899).
          seen = {
              "package.json": pkg,
              "pyproject.toml": proj["version"],
              "PANEL_VERSION": m.group(1),
              "web/changelog.json": rendered_version,
          }
          if len(set(seen.values())) != 1:
              sys.exit("VERSION MISMATCH: " + ", ".join(f"{k}={v}" for k, v in seen.items()) + " — run scripts/set-version.mjs")
          print(f"publishing {proj['name']} {proj['version']} (all four release version witnesses match)")
          PY
      # --------------------------------------------------------------------

      # Every publish to the Registry has shipped with a BLANK changelog.
      # `comfy node publish` accepts `--changelog-file <path>` — the Registry
      # shows it in the pack's Updates section — but the wrapper action below
      # never passed one. CHANGELOG.md is already curated per version, so it
      # is the honest source. Same underlying gap as comfyui-mcp's GitHub
      # Release fix (mcp#1138); this is its Registry twin.
      #
      # The authoritative version and its non-empty changelog section are required
      # by the release guard above. This extraction remains fail-open only for the
      # Registry's optional --changelog-file convenience.
      # THIS STEP CANNOT FAIL THE JOB, BY CONSTRUCTION. Release notes are a
      # nicety; the release itself is not. There is deliberately no `set -e`
      # and the step ends in `exit 0`, so every way this can go wrong — no
      # an extraction failure lands in the same place: `path=` empty, and the
      # publish step below ships without optional changelog notes. A missing or
      # empty current-version section cannot reach this step because the guard above
      # already fails the job.
      #
      - name: Extract this version's changelog for the Registry
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -uo pipefail
          version="$RELEASE_VERSION"
          if [ -n "$version" ] && node scripts/changelog-section.mjs "$version" > registry-changelog.md; then
            echo "path=registry-changelog.md" >> "$GITHUB_OUTPUT"
            echo "changelog for $version ($(wc -c < registry-changelog.md) chars):"
            cat registry-changelog.md
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No usable CHANGELOG section (version='${version}') — publishing with no changelog."
          fi
          exit 0

      # Previously `uses: Comfy-Org/publish-node-action@main` — a thin wrapper
      # over exactly these three steps with no way to pass --changelog-file
      # through it (github.com/Comfy-Org/publish-node-action/blob/main/action.yml
      # exposes only personal_access_token/skip_checkout). Inlined instead of
      # relying on undocumented env-var propagation into a third-party
      # composite action's internals.
      #
      # THE CHANGELOG MUST NEVER COST US THE RELEASE. Adding `--changelog-file`
      # to a command that worked without it introduces new ways for that command
      # to fail, and they are not hypothetical — in comfy-cli's own
      # `resolve_publish_changelog` an unreadable or non-UTF-8 changelog file is
      # `typer.Exit(code=1)`, and `pip install comfy-cli` is unpinned, so a
      # version predating the flag would reject the argument outright. Either
      # would have aborted the publish under the previous single-attempt shape.
      #
      # So: attempt WITH the notes, and on any failure retry WITHOUT them. The
      # fallback is a genuine second `comfy node publish`, which is safe for the
      # dominant failure modes above because they happen during argument parsing
      # or file reading, before anything is uploaded. If the first attempt
      # instead died *after* registering the version, the retry will fail on the
      # duplicate and the job goes red — a loud, accurate "already published"
      # rather than a silently skipped release.
      #
      # Note the secret and the path move into `env:` rather than being
      # interpolated by `${{ }}` into the script body, so neither is expanded
      # into the shell source that the runner echoes and parses.
      - name: Publish custom node
        env:
          CHANGELOG_PATH: ${{ steps.changelog.outputs.path }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pip install comfy-cli
          comfy --skip-prompt --no-enable-telemetry env
          if [ -n "$CHANGELOG_PATH" ]; then
            if comfy node publish --changelog-file "$CHANGELOG_PATH" --token "$REGISTRY_TOKEN"; then
              exit 0
            fi
            echo "::warning::Registry publish with --changelog-file failed — retrying WITHOUT the changelog so the release still ships."
          fi
          comfy node publish --token "$REGISTRY_TOKEN"

      # Inverse of release-tag-guard.yml: that workflow hangs off the tag push,
      # so a publish that never gets a tag (0.15.97, 0.15.111–0.15.113) is
      # silent. This runs because the publish ran. --ensure creates the
      # annotated tag on the commit that cut the version when it is missing;
      # --push is what makes the operand visible to `git tag` afterwards.
      - name: Published version must have a git tag
        run: node scripts/check-release-tag.mjs --published --ensure --push
