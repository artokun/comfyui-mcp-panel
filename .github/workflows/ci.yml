name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  panel:
    runs-on: ubuntu-latest
    name: Lint pack (JS syntax + Python + pyproject)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # web/js is served LIVE via the custom_nodes junction — a single broken
      # save throws in ComfyUI's extension loader and takes down the WHOLE
      # frontend (no sidebar). node --check is the cheapest guard against that.
      - name: JS syntax check (web/js)
        shell: bash
        run: |
          set -e
          shopt -s globstar nullglob
          found=0
          for f in web/js/**/*.js; do
            found=1
            echo "node --check $f"
            node --check "$f"
          done
          [ "$found" = "1" ] || { echo "::error::no web/js/*.js files found"; exit 1; }

      # This panel calls the MCP server's tools by BARE STRING from browser JS —
      # callTool("download_model") — and names panel tools inside hint strings the
      # model acts on. Nothing type-checks either, so a rename in comfyui-mcp
      # silently ships a panel whose buttons fail with tool-not-found that the model
      # cannot diagnose and the user reads as "the panel is broken". That already
      # happened: a graph-reading tool removed upstream survived in five live error
      # paths plus the README's tool table (fixed in the commit that added this).
      # Its name is deliberately not repeated here — this gate is strict enough to
      # flag its own CI comment, and prose should point at the replacement instead.
      #
      # Validates every literal against vendor/tool-vocabulary.json, generated by
      # `npm run vocab:export` in comfyui-mcp (whose CI fails if that artefact drifts
      # from its ledger). Positive allowlist, so it catches names nobody enumerated.
      # Pure node + git, so it needs no install and runs before one.
      - name: Tool vocabulary (no calls to tools that don't exist)
        run: node scripts/check-tool-vocabulary.mjs

      # These three scripts existed and were never run in CI, so the panel's own
      # tests could break without anyone noticing. test:e2e is deliberately NOT
      # here: playwright.config.ts requires a real ComfyUI at :8188 with models
      # loaded, so it belongs to the pre-release local soak, not to a runner.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Anti-regression for the #268 class: the panel must never depend on a
      # ComfyUI frontend workflow-service method that the INSTALLED
      # comfyui_frontend_package does not expose. frontend-contract.test.mjs
      # derives the depended-on set from source and verifies it against a real
      # installed bundle — but only if one is present, so we install it here and
      # point the test at its static dir. Without this step the bundle
      # assertions would silently skip and could not catch #268 in CI.
      - name: Install comfyui_frontend_package (for the frontend-contract test)
        shell: bash
        run: |
          python -m pip install --quiet comfyui_frontend_package
          static="$(python -c 'import comfyui_frontend_package, os; print(os.path.join(os.path.dirname(comfyui_frontend_package.__file__), "static"))')"
          echo "COMFYUI_FRONTEND_STATIC=$static" >> "$GITHUB_ENV"
          echo "using installed frontend static bundle at: $static"

      - name: Unit tests (Node --test, incl. frontend contract)
        run: |
          npm ci
          npm run test:unit

      # __init__.py must compile and (by design) only register read-only routes
      # at import time. py_compile catches syntax breakage.
      - name: Python compile check (__init__.py)
        run: python -m py_compile __init__.py

      # comfy-cli parity: publishing already WARNS that "we will soon disable
      # exec and eval, and multiple statements in a single line" — when that
      # becomes a hard error it breaks `Publish to Comfy Registry`, i.e. we
      # find out at release time. Fail here instead. AST-based on purpose: a
      # grep for ";" matches semicolons inside string literals and would flag
      # clean files (it did — every py/ hit was a false positive).
      - name: comfy-cli parity — no exec/eval, no multi-statement lines
        run: |
          python - <<'PY'
          import ast, collections, pathlib, sys
          bad = []
          for f in sorted(pathlib.Path(".").rglob("*.py")):
              if any(p in f.parts for p in (".git", "node_modules", ".venv", "venv", "__pycache__")):
                  continue
              tree = ast.parse(f.read_text(encoding="utf-8"), str(f))
              per_line = collections.Counter(
                  n.lineno for n in ast.walk(tree) if isinstance(n, ast.stmt)
              )
              for line in sorted(l for l, c in per_line.items() if c > 1):
                  bad.append(f"{f}:{line}: multiple statements on one line")
              for n in ast.walk(tree):
                  if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id in ("exec", "eval"):
                      bad.append(f"{f}:{n.lineno}: {n.func.id}() call")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Install bandit
        run: pip install bandit

      # Comfy Registry security-scan parity. The Registry flags custom nodes that
      # spawn processes / install-and-run packages at runtime, or use
      # eval/exec/os.system/pickle — see https://docs.comfy.org/registry/standards.
      # The Registry's own scanner is private, but Comfy-Org's public stand-in
      # (christian-byrne/custom-nodes-security-scan) runs Bandit with these exact
      # excludes (B101 assert / B112 try-except-continue / B311 random). Running
      # the SAME config here fails a would-be-flagged release in CI FIRST, instead
      # of publishing a version that never promotes to "latest" on the Registry.
      # (`import subprocess` = B404; subprocess calls = B602/B603 — exactly what
      # flagged every 0.x release before this pack went pure-frontend.)
      # No `-ll`: the stand-in reports ALL severities (only B101/B112/B311 excluded),
      # so LOW-severity smells like B110 (try/except/pass) are caught here too.
      - name: Security scan (Comfy Registry parity — Bandit)
        run: bandit -r . -s B101,B112,B311

      # Comfy Registry security-scan parity — YARA. The scanner also runs YARA
      # rules over ALL files (JS included). The one that bit us for every release
      # 0.1.0→0.6.1 was `SUSP_SVG_Onload_Onerror_Jul23`, which fires on the mere
      # co-occurrence in a file of "svg" AND ("onload" | "onerror") — nocase, no
      # proximity. It's a false positive on DOMPurify (a sanitizer contains those
      # XSS tokens by design) and on our own image handlers. Guard against a
      # regression: no shipped web/js file may contain svg + onload/onerror.
      # Fix pattern: addEventListener("load"|"error") instead of .onload/.onerror,
      # and keep the literal "onload"/"onerror" tokens out of comments.
      # ONE enumeration of the published archive, BOTH YARA parity rules.
      #
      # They were two steps with two different file sets, and that duplication is what
      # produced four rounds of drift: each fix corrected one set and left the other
      # behind. The SVG rule ended up computing tracked-minus-.comfyignore while the
      # exec rule still used hardcoded roots — so `.gitignore`, which IS tracked and is
      # NOT .comfyignore'd, shipped while being scanned by neither. Sharing the
      # enumeration makes that class of divergence impossible rather than unlikely.
      - name: Security scan (Comfy Registry parity — YARA over the published archive)
        shell: bash
        run: |
          python3 - <<'PY'
          import fnmatch, pathlib, re, subprocess, sys

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, text=True, check=True
          ).stdout.split("\0")
          patterns = [
              l.strip()
              for l in pathlib.Path(".comfyignore").read_text(encoding="utf-8").splitlines()
              if l.strip() and not l.strip().startswith("#")
          ]

          def shipped(p: str) -> bool:
              for pat in patterns:
                  if pat.endswith("/") and (p + "/").startswith(pat):
                      return False
                  if fnmatch.fnmatch(p, pat) or fnmatch.fnmatch(pathlib.PurePath(p).name, pat):
                      return False
              return True

          # CHANGELOG.md must stay ignored: it documents security fixes, so it will always
          # quote the very literals the scanner flags.
          if "CHANGELOG.md" not in patterns:
              print("::error file=.comfyignore::CHANGELOG.md must stay .comfyignore'd — its prose quotes exec-call literals the registry YARA scan flags.")
              sys.exit(1)

          EXEC = re.compile(r"subprocess\.(?:Popen|run|call|check_output|check_call)\s*\(|os\.system\s*\(")
          archive = [p for p in tracked if p and shipped(p)]
          bad = []
          for p in archive:
              try:
                  raw = pathlib.Path(p).read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue  # unreadable; nothing to assert
              low = raw.lower()
              if "svg" in low and ("onload" in low or "onerror" in low):
                  bad.append((p, "SUSP_SVG_Onload_Onerror (svg + onload/onerror in one shipped file) — use addEventListener('load'/'error') and drop literal onload/onerror tokens"))
              if EXEC.search(raw):
                  bad.append((p, "process-spawn call literal — the registry YARA scan ($subprocess_popen_direct et al.) flags this in ANY shipped file, prose included"))

          for p, why in bad:
              print(f"::error file={p}::{why}")
          print(f"scanned {len(archive)} shipped files", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

      # The registry applies .comfyignore with gitignore semantics: a bare
      # `vendor/` matches a vendor dir at ANY depth, so the exclusion meant for
      # the root CI artefact also silently dropped web/js/vendor/ (the runtime
      # marked/DOMPurify/qrcode/a2ui-lit imports) from the pack — the browser
      # 404'd on import and the sidebar never registered (#749). The parity
      # scan above reimplements the matching root-anchored and cannot see this
      # class of loss, so assert with git's OWN ignore engine instead (empty
      # index: check-ignore skips tracked paths).
      - name: Pack contents — runtime assets must not be .comfyignore'd
        shell: bash
        run: |
          set -e
          export GIT_INDEX_FILE="$PWD/.git/pack-contents-empty-index"
          trap 'rm -f "$GIT_INDEX_FILE"' EXIT
          for f in \
            web/js/comfyui-mcp-panel.js \
            web/js/vendor/marked.esm.js \
            web/js/vendor/purify.es.js \
            web/js/vendor/qrcode.esm.js \
            web/js/vendor/a2ui-lit.bundle.js \
          ; do
            if git -c core.excludesFile=.comfyignore check-ignore -q "$f"; then
              echo "::error file=.comfyignore::$f is exclude-matched but imported at runtime — the published pack would 404 on import and the sidebar would never register (#749)"
              exit 1
            fi
          done
          # …while the CI-only vocabulary artefact MUST stay excluded.
          if ! git -c core.excludesFile=.comfyignore check-ignore -q vendor/tool-vocabulary.json; then
            echo "::error file=.comfyignore::vendor/tool-vocabulary.json must stay .comfyignore'd (CI-only artefact consumed by scripts/check-tool-vocabulary.mjs)"
            exit 1
          fi

      - name: pyproject.toml is valid + has registry fields + JS version matches
        run: |
          python - <<'PY'
          import tomllib, re, sys, json
          d = tomllib.load(open("pyproject.toml", "rb"))
          proj = d.get("project", {})
          comfy = d.get("tool", {}).get("comfy", {})
          missing = [k for k in ("name", "version", "description", "license") if not proj.get(k)]
          if not comfy.get("PublisherId"):
              missing.append("tool.comfy.PublisherId")
          assert not missing, f"pyproject missing required fields: {missing}"
          # The panel JS carries PANEL_VERSION for its "Need help?" diagnostics blob;
          # a build step can't inject it (the file is served raw), so ENFORCE that it
          # equals pyproject's version here — a mismatch fails CI + the publish gate
          # so a stale panel version can never ship (see scripts/set-version.mjs to
          # bump both at once).
          js = open("web/js/comfyui-mcp-panel.js", encoding="utf-8").read()
          m = re.search(r'const PANEL_VERSION = "([^"]+)"', js)
          assert m, "PANEL_VERSION constant not found in web/js/comfyui-mcp-panel.js"
          # package.json is the version npm bumps at release; pyproject + PANEL_VERSION are
          # what set-version.mjs writes. Comparing only the latter two could never catch the
          # real failure — that set-version.mjs was not run AT ALL — because one script writes
          # both, so they cannot disagree. That is exactly how 0.15.86..0.15.96 shipped with
          # pyproject and PANEL_VERSION frozen at 0.15.85 while CI stayed green. Compare all
          # three, so a release that skips set-version.mjs is a RED build.
          pkg = json.load(open("package.json", encoding="utf-8")).get("version")
          seen = {"package.json": pkg, "pyproject.toml": proj["version"], "PANEL_VERSION": m.group(1)}
          if len(set(seen.values())) != 1:
              sys.exit(
                  "VERSION MISMATCH: "
                  + ", ".join(f"{k}={v}" for k, v in seen.items())
                  + f" — run `node scripts/set-version.mjs {pkg}`."
              )
          print(f"pyproject OK: {proj['name']} {proj['version']} (package.json + JS PANEL_VERSION match)")
          PY
